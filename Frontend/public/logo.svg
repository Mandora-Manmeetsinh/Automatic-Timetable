<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333ea;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Main Background: Rounded Square with Gradient -->
  <rect x="64" y="64" width="384" height="384" rx="96" fill="url(#grad)" filter="url(#shadow)" />
  
  <!-- Inner Calendar/Grid Elements -->
  <rect x="128" y="148" width="256" height="216" rx="32" fill="#ffffff" fill-opacity="0.15" />
  
  <!-- Clock Hands / Time Element -->
  <circle cx="256" cy="256" r="16" fill="#ffffff" />
  <path d="M256 256 L256 180" stroke="#ffffff" stroke-width="32" stroke-linecap="round" />
  <path d="M256 256 L320 320" stroke="#ffffff" stroke-width="32" stroke-linecap="round" />
  
  <!-- Decorative Dots for "Grid" feel -->
  <circle cx="160" cy="110" r="16" fill="#ffffff" fill-opacity="0.8" />
  <circle cx="352" cy="110" r="16" fill="#ffffff" fill-opacity="0.8" />
</svg>
